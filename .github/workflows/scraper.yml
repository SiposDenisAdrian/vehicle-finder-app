name: Car Scraper Cron

on:
  schedule:
    - cron: "0 7 * * 1"
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: car-scraper
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check weekly Romania schedule
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ "$(TZ=Europe/Bucharest date +'%u %H')" = "1 10" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  scrape:
    needs: schedule
    if: needs.schedule.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper
        env:
          LISTING_URLS: ${{ vars.LISTING_URLS }}
          MAX_LISTINGS: ${{ vars.MAX_LISTINGS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for attempt in 1 2 3; do
            echo "Scraper attempt ${attempt}/3"
            if python checker.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 30))
              echo "Scraper failed; retrying in ${delay} seconds."
              sleep "$delay"
            fi
          done
          echo "Scraper failed after 3 attempts."
          exit 1

      - name: Commit recommendation cache
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add car_evaluations.json
          if ! git diff --cached --quiet; then
            git commit -m "Update car recommendation cache"
            git push
          fi
